# Red mínima de arranque de ArgoCD (bootstrap). Requiere Cilium.
# Única salida externa de la plataforma: argocd-repo-server -> GitHub + repos Helm (FQDN explícito, 443).
# Integraciones posteriores (Traefik, Prometheus) van en k8s/platform/config/argocd/.
---
# 1. argocd-server: API server, repo-server y Redis
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server-bootstrap
  namespace: argocd
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data-services
            app: redis
            redis_setup_type: standalone
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
