apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-artifactory
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: microservices-platform
    platform.dev/wave: "31"
    platform.dev/stage: config
    platform.dev/component: artifactory
  annotations:
    argocd.argoproj.io/sync-wave: "31"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jantolino/microservices-platform.git
    targetRevision: HEAD
    path: k8s/platform/config/artifactory
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
