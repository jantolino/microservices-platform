# Red mínima de arranque de Redis (bootstrap). Requiere Cilium.
# DNS lo cubre allow-dns de Foundation; todo lo demás queda denegado por default-deny-all.
---
# 1. Redis Operator: API server y gestión de la instancia Redis
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-operator-bootstrap
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: redis-operator
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: redis
            redis_setup_type: standalone
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# 2. Redis: solo acepta conexiones de ArgoCD (server, repo-server, controller) y del operador
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-bootstrap
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app: redis
      redis_setup_type: standalone
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-repo-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-application-controller
        - matchLabels:
            app.kubernetes.io/name: redis-operator
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
