# Etiquetas globales
commonLabels:
  part-of: microservices-platform

# Etiquetas para el pod del operador
podLabels:
  part-of: microservices-platform

# Etiquetas para el servicio (opcional)
serviceLabels:
  part-of: microservices-platform

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

featureGates:
  GenerateConfigInInitContainer: true