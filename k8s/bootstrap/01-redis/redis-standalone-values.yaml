# Etiquetas globales
labels:
  part-of: microservices-platform

# Configuración del recurso Redis (standalone)
redisStandalone:
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 500Mi
  persistence:
    enabled: true
    storageClassName: ""
    storageSize: 3Gi


  # Desactivar autenticación (opcional, para simplificar)
  redisSecret:
    secretName: ""

externalConfig:
  enabled: true

serviceMonitor:
  enabled: false