# Etiquetas globales
labels:
  part-of: microservices-platform

# Configuración del recurso Redis (standalone)
redisStandalone:
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 500Mi
  persistence:
    enabled: true
    storageClassName: ""
    storageSize: 3Gi


  # Secret `redis-auth` generado por bootstrap.sh (nunca en Git); luego se publica en Vault (config/redis)
  redisSecret:
    secretName: redis-auth
    secretKey: password

externalConfig:
  enabled: true

serviceMonitor:
  enabled: false