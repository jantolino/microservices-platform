apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-vault-config-operator
  namespace: argocd
  labels:
    platform.dev/part-of: microservices-platform
    platform.dev/wave: "n2"
    platform.dev/stage: config
    platform.dev/group: secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jantolino/microservices-platform.git
    targetRevision: HEAD
    path: k8s/platform/config/vault-config-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # CRDs del VCO aun no registrados
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
