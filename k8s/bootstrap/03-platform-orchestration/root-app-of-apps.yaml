apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jantolino/microservices-platform.git
    targetRevision: HEAD
    path: k8s/bootstrap/03-platform-orchestration # Apunta a su misma carpeta
    directory:
      recurse: true
      exclude: "root-app-of-apps.yaml"         # Evita que ArgoCD se lea a sí mismo en bucle
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true