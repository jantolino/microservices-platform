apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
  annotations:
    # Wave -2: posterior a external-secrets (wave -4) y a vault (wave -3),
    # garantizando que el CRD ClusterSecretStore ya exista y Vault esté disponible.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jantolino/microservices-platform.git
    targetRevision: HEAD
    path: k8s/platform/config/cluster-secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
