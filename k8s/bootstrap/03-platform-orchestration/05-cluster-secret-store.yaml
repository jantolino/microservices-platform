apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
  labels:
    platform.dev/part-of: microservices-platform
    platform.dev/wave: "05"
    platform.dev/stage: config
    platform.dev/group: security
  annotations:
    # Wave 5: posterior a external-secrets (1), vault (2), vault-config-operator (3)
    # y a los CRDs de configuración de Vault (4), garantizando que el role de Vault
    # ya exista antes de que ESO intente autenticarse.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jantolino/microservices-platform.git
    targetRevision: HEAD
    path: k8s/platform/config/cluster-secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # CRDs de ESO aún no registrados
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
