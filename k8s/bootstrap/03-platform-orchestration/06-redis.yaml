# Application: redis
# Wave 06 (tras cluster-secret-store): operador + Redis standalone compartido de
# data-services, antes de sus consumidores (Redis Insight wave 10, GitLab wave 19).
# El password viene de Vault vía redis-es.yaml; ArgoCD ya no lo consume (usa su
# Redis embebido).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: microservices-platform
    platform.dev/component: redis
    platform.dev/sync-wave: "06"
  annotations:
    argocd.argoproj.io/sync-wave: "06"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jantolino/microservices-platform.git
    targetRevision: main
    path: k8s/platform/components/data-services/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: data-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
