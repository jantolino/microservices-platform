apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-default
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    part-of: microservices-platform
provisioner: k8s.io/minikube-hostpath # Addon storage-provisioner de Minikube (kubernetes.io/hostpath no aprovisiona)
reclaimPolicy: Delete               # En local, si borras la DB, limpia el disco
volumeBindingMode: Immediate