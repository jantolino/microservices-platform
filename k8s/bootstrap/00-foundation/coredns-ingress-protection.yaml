# CoreDNS solo acepta DNS desde los namespaces de la plataforma (label part-of),
# probes del kubelet (host) y métricas desde Prometheus (1.2c).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: coredns-ingress-protection
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      k8s:k8s-app: kube-dns
  ingress:
    # Consultas DNS (53) desde namespaces etiquetados part-of: microservices-platform
    # y desde componentes de sistema (kube-system, pods hostNetwork / nodo)
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.part-of: microservices-platform
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Probes del kubelet: liveness 8080 / readiness 8181
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8181"
              protocol: TCP
    # Métricas 9153 desde Prometheus
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
