# 1. Creación del Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: networking
  labels:
    part-of: microservices-platform
---
# 2. Presupuesto de Recursos (ResourceQuota)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: networking-quota
  namespace: networking
spec:
  hard:

    requests.cpu: "700m"
    requests.memory: "1.5Gi"

    limits.cpu: "900m"
    limits.memory: "2Gi"

    pods: "10"
---
# 3. Límites por Defecto por Pod (LimitRange)
apiVersion: v1
kind: LimitRange
metadata:
  name: networking-limits
  namespace: networking
spec:
  limits:
  - type: Container

    default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"

    max:
      cpu: "1"
      memory: "2Gi"

    min:
      cpu: "50m"
      memory: "64Mi"
---
# 4. Aislamiento de Red (Default Deny All)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: networking
  labels:
    part-of: microservices-platform
spec:
  podSelector: {} # Afecta a todos los pods DENTRO de 'networking'
  policyTypes:
  - Ingress
  - Egress
