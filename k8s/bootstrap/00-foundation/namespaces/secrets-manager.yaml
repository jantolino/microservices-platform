# 1. Creación del Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: secrets-manager
  labels:
    part-of: microservices-platform
---
# 2. Presupuesto de Recursos (ResourceQuota)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: secrets-manager-quota
  namespace: secrets-manager
spec:
  hard:

    requests.cpu: "1"
    requests.memory: "2Gi"

    limits.cpu: "1500m"
    limits.memory: "3Gi"

    pods: "15"
---
# 3. Límites por Defecto por Pod (LimitRange)
apiVersion: v1
kind: LimitRange
metadata:
  name: secrets-manager-limits
  namespace: secrets-manager
spec:
  limits:
  - type: Container
    # --- SAFETY NET (Si un chart NO trae recursos definidos) ---
    default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"

    max:
      cpu: "1"
      memory: "2Gi"

    min:
      cpu: "50m"
      memory: "64Mi"
---
# 4. Aislamiento de Red (Default Deny All)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  podSelector: {} # Afecta a todos los pods DENTRO de 'vault'
  policyTypes:
  - Ingress
  - Egress
