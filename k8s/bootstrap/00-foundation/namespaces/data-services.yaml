# 1. Creación del Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: data-services
  labels:
    part-of: microservices-platform
---
# 2. Presupuesto de Recursos (ResourceQuota)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-services-quota
  namespace: data-services
spec:
  hard:

    requests.cpu: "1000m"
    requests.memory: "2.5Gi"

    limits.cpu: "2000m"
    limits.memory: "4Gi"

    pods: "15"
---
# 3. Límites por Defecto por Pod (LimitRange)
apiVersion: v1
kind: LimitRange
metadata:
  name: data-services-limits
  namespace: data-services
spec:
  limits:
  - type: Container
    # --- SAFETY NET (Si un chart NO trae recursos definidos) ---
    default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    # --- TECHO INDIVIDUAL (Policía Estricta) ---
    # Ningún pod individual (ej. PostgreSQL) puede pedir más de estos recursos.
    max:
      cpu: "1"
      memory: "2Gi"
    # --- PISO MÍNIMO ---
    min:
      cpu: "20m"
      memory: "64Mi"
---
# 4. Aislamiento de Red (Default Deny All)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  podSelector: {} # Afecta a todos los pods DENTRO de 'data-services'
  policyTypes:
  - Ingress
  - Egress
