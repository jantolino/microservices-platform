# ApplicationSet para desplegar toda la plataforma desde la carpeta platform/
# Respeta el orden de dependencias mediante sync-waves
# Aplicar después de que ArgoCD esté corriendo: kubectl apply -f k8s/bootstrap/applicationset-definitivo.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/jantolino/microservices-platform.git
        revision: HEAD
        directories:
          # Wave -5: Cert-Manager (primero, emite certificados)
          - path: platform/cert-manager
            exclude: false
          # Wave -4: External-Secrets Operator (necesita certificados para conectar con Vault)
          - path: platform/external-secrets
          # Wave -3: Vault (necesita External-Secrets o TLS)
          - path: platform/vault
          ## Wave -2: Traefik (necesita certificados de Cert-Manager)
          #- path: platform/networking/traefik
          ## Wave -1: Bases de datos y servicios de datos (independientes)
          #- path: platform/data-services/ddbb/postgres
          #- path: platform/data-services/redis
          #- path: platform/data-services/rabbitmq
          ## Wave 0: Repositorios y artefactos (dependen de bases de datos)
          #- path: platform/repositories/gitlab
          #- path: platform/devops-tools/artifactory
          ## Wave 1: CI/CD y calidad (dependen de GitLab)
          #- path: platform/devops-tools/jenkins
          #- path: platform/devops-tools/sonarqube
          ## Wave 2: Observabilidad (independiente, pero se puede desplegar más tarde)
          #- path: platform/monitoring/prometheus-stack
          #- path: platform/monitoring/elk
          #- path: platform/monitoring/jaeger
          ## Wave 3: Seguridad y gestión (independientes)
          #- path: platform/security/trivy
          #- path: platform/dashboard
  template:
    metadata:
      name: '{{ path.basename }}'
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .path.wave }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/jantolino/microservices-platform.git
        targetRevision: HEAD
        path: '{{ path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
---
# Configuración específica por componente (sync-waves manuales)
# Si el generador de directorios no asigna waves automáticamente, se pueden crear Applications individuales
# o usar el campo 'path.wave' si se configura en el repositorio. Aquí se definen las waves por defecto.
---
# Cert-Manager (Wave -5)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
