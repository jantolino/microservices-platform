# Definición de NetworkPolicies para la arquitectura de microservicios
# Basado en la documentación oficial de Kubernetes:
# https://v1-32.docs.kubernetes.io/docs/concepts/services-networking/network-policies/
# https://v1-32.docs.kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/

# NetworkPolicy es una especificación de cómo los grupos de pods pueden comunicarse entre sí y con otros endpoints de red.
# NetworkPolicies proporcionan seguridad a nivel de red en Kubernetes, similar a los firewalls tradicionales.

# Política para el namespace data-services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-services-network-policy
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  podSelector: {} # Se aplica a todos los pods en el namespace
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: microservices
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: ingress
    - namespaceSelector:
        matchLabels:
          name: devops-tools
    ports:
    - protocol: TCP
      port: 6379 # Puerto Redis
    - protocol: TCP
      port: 5672 # Puerto RabbitMQ AMQP
    - protocol: TCP
      port: 15672 # Puerto RabbitMQ Management
  egress:
  - to:
    - namespaceSelector: {}
      podSelector: {}
    ports:
    - protocol: TCP
      port: 53 # DNS
    - protocol: UDP
      port: 53 # DNS

---

# Política para el namespace microservices
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microservices-network-policy
  namespace: microservices
  labels:
    part-of: microservices-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP

---

# Política para el namespace security (Vault)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-network-policy
  namespace: security
  labels:
    part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    # Permitir acceso desde el namespace de microservices
    - namespaceSelector:
        matchLabels:
          name: microservices
    # Permitir acceso desde el namespace de devops-tools
    - namespaceSelector:
        matchLabels:
          name: devops-tools
    # Permitir acceso desde el namespace de monitoring
    - namespaceSelector:
        matchLabels:
          name: monitoring
    # Permitir acceso desde el namespace de data-services
    - namespaceSelector:
        matchLabels:
          name: data-services
    # Permitir acceso desde el namespace de ingress (Traefik)
    - namespaceSelector:
        matchLabels:
          name: ingress
    ports:
    - protocol: TCP
      port: 8200
  egress:
  - to:
    # Permitir conexiones a servicios DNS
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Permitir conexiones a otros servicios dentro del clúster
  - to: []
    ports:
    - protocol: TCP
      port: 8080 # Puerto común para microservicios

---

# Política para el namespace monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-network-policy
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 3000 # Grafana
    - protocol: TCP
      port: 9090 # Prometheus
    - protocol: TCP
      port: 9200 # Elasticsearch
    - protocol: TCP
      port: 5601 # Kibana
    - protocol: TCP
      port: 16686 # Jaeger UI
    - protocol: TCP
      port: 14268 # Jaeger Collector HTTP
    - protocol: TCP
      port: 14250 # Jaeger Collector gRPC
    - protocol: UDP
      port: 6831  # Jaeger Agent thrift compact
    - protocol: UDP
      port: 6832  # Jaeger Agent thrift binary
  egress:
  - to:
    - namespaceSelector: {}
      podSelector: {}

---

# Política para el namespace devops-tools
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-tools-network-policy
  namespace: devops-tools
  labels:
    part-of: microservices-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080 # Jenkins
    - protocol: TCP
      port: 80 # GitLab HTTP
    - protocol: TCP
      port: 443 # GitLab HTTPS
    - protocol: TCP
      port: 8082 # Artifactory OSS
  egress:
  - to:
    - namespaceSelector: {}
      podSelector: {}

---

# Política para el namespace ingress (Traefik)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-network-policy
  namespace: ingress
  labels:
    part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
  egress:
  - to:
    - namespaceSelector: {}
      podSelector: {}

---
