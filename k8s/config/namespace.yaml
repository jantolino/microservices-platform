# Definición de Namespaces para la arquitectura de microservicios
# Basado en la documentación oficial de Kubernetes:
# https://v1-32.docs.kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
# https://v1-32.docs.kubernetes.io/docs/tasks/administer-cluster/namespaces/

# Los namespaces proporcionan un mecanismo para aislar grupos de recursos dentro de un mismo clúster.
# Son especialmente útiles cuando múltiples usuarios o equipos utilizan el mismo clúster Kubernetes.

apiVersion: v1
kind: Namespace
metadata:
  name: event-management
  labels:
    name: event-management
    part-of: microservices-platform
    environment: development

