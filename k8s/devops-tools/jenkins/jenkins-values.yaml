# jenkins-sonarqube-values.yaml
# Configuración para Jenkins con Helm chart (versión 5.9.12)

# Configuración del controlador (Jenkins master)
controller:

  labels:
    part-of: microservices-platform
  podLabels:
    part-of: microservices-platform
  serviceLabels:
    part-of: microservices-platform

  # Imagen del controlador – estructura esperada por el chart
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "lts"
    pullPolicy: IfNotPresent

  # Recursos (CPU y memoria)
  resources:
    requests:
      cpu: "300m"      # Baja de 250m a 200m
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "2Gi"

  # Opciones de Java
  javaOpts: "-Xms512m -Xmx2048m"

  # Credenciales de administrador (cambia la contraseña)
  admin:
    user: "admin"
    password: "admin123"   # ← Cámbiala por una segura

  # URL pública de Jenkins (usada en la interfaz)
  jenkinsUrl: "http://jenkins.desarrollo"
  jenkinsAdminEmail: "admin@microservices-platform.local"

  # Desactivamos la creación automática del Ingress (lo haremos manualmente)
  ingress:
    enabled: false

  # Plugins a instalar en el primer arranque
  installPlugins:
    # ------------------------------------------------------------
    # Plugins esenciales para pipelines y Kubernetes
    # ------------------------------------------------------------
    - "kubernetes:latest"
    # Permite que Jenkins cree pods dinámicos en Kubernetes para ejecutar builds.
    # Cada job puede usar un pod efímero con las herramientas necesarias.

    - "workflow-aggregator:latest"
    # Proporciona el conjunto de plugins para pipelines declarativas y scripted.
    # Esencial para definir flujos CI/CD como código.

    - "git:latest"
    # Integra Git con Jenkins, permitiendo clonar repositorios, gestionar branches,
    # y ejecutar hooks de Git. Necesario para cualquier integración con GitLab.

    - "credentials-binding:latest"
    # Permite gestionar y usar credenciales de forma segura en los pipelines,
    # como tokens de GitLab, claves SSH, usuarios de Docker Hub, etc.

    - "pipeline-stage-view:latest"
    # Añade una visualización gráfica de las etapas de los pipelines en la UI de Jenkins,
    # facilitando la depuración y el seguimiento.

    - "configuration-as-code:latest"
    # Implementa Jenkins Configuration as Code (JCasC), permitiendo definir la
    # configuración de Jenkins (plugins, credenciales, jobs) en un fichero YAML.
    # Esencial para un despliegue reproducible.

    # ------------------------------------------------------------
    # Plugins específicos para GitLab
    # ------------------------------------------------------------
    - "gitlab-plugin:latest"
    # Permite que Jenkins reciba notificaciones de GitLab (webhooks) y envíe el estado
    # de los builds de vuelta a GitLab. Activa pipelines automáticamente tras cada push
    # o merge request.

    # ------------------------------------------------------------
    # Plugins para construcción de imágenes Docker
    # ------------------------------------------------------------
    - "docker-workflow:latest"
    # Proporciona pasos en pipelines para construir, publicar y gestionar imágenes
    # Docker. Se integra con el plugin de credenciales para usar registries privados.

  # Configuración de probes
  healthProbes: true
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 12
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 6

  # Servicio (lo expondremos con Ingress, por eso ClusterIP)
  serviceType: ClusterIP
  servicePort: 8080

# Persistencia
persistence:
  enabled: true
  size: "10Gi"
  storageClass: "standard"

# Configuración del sidecar (recarga de configuración)
sidecar:
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# Configuración del agente (opcional, se pueden usar pods dinámicos)
agent:
  enabled: true
  image:
    registry: docker.io
    repository: jenkins/inbound-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"

# RBAC
rbac:
  create: true
serviceAccount:
  create: true
  name: jenkins

# Desactivar NetworkPolicy en desarrollo
networkPolicy:
  enabled: false

# Integración con Prometheus
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
    interval: 30s