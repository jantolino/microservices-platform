apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ui-route
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - websecure
  tls: {}   # usa el TLSStore default (cert *.dev.lab, wave 19)
  routes:
    - match: Host(`prometheus.dev.lab`)
      kind: Rule
      services:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090