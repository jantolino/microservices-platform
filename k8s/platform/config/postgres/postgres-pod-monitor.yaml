apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-metrics
  namespace: data-services
  labels:
    release: prometheus
    part-of: microservices-platform
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  namespaceSelector:
    matchNames:
      - data-services
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
