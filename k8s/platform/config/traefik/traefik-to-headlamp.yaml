# Salida de Traefik hacia Headlamp (IngressRoute headlamp-ui-route).
# La entrada correspondiente está en k8s/platform/config/headlamp/headlamp-network-policy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-to-headlamp
  namespace: networking
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: headlamp
            app.kubernetes.io/name: headlamp
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP
