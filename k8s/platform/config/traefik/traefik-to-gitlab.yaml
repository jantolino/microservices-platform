# Salida de Traefik hacia GitLab webservice (IngressRoute gitlab-web-route).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-to-gitlab
  namespace: networking
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: repositories
            app: gitlab-webservice-default
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
