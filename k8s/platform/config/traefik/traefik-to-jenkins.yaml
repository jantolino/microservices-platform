# Salida de Traefik hacia Jenkins (IngressRoute jenkins-ui-route).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-to-jenkins
  namespace: networking
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devops-tools
            app.kubernetes.io/name: jenkins
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
