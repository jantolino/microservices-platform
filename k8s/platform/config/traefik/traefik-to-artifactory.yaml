# Salida de Traefik hacia Artifactory (IngressRoute artifactory-ui-route).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-to-artifactory
  namespace: networking
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devops-tools
            app.kubernetes.io/name: artifactory
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
