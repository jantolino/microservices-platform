# Salida de Traefik hacia Redis Insight (IngressRoute redis-insight-route).
# La entrada correspondiente está en k8s/platform/config/redis-insight/redis-insight-network-policy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-to-redis-insight
  namespace: networking
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data-services
            app.kubernetes.io/name: redis-insight
      toPorts:
        - ports:
            - port: "5540"
              protocol: TCP
