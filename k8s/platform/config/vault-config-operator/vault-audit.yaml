# Auditoría de Vault: registra toda operación (lecturas, escrituras, logins) en /vault/audit/audit.log
# (PVC server.auditStorage del chart). Vault es fail-closed: si no puede escribir el audit, rechaza peticiones.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Audit
metadata:
  name: platform-audit
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: default
  path: file
  type: file
  options:
    file_path: /vault/audit/audit.log
