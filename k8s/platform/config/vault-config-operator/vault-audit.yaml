# Auditoría de Vault: registra toda operación (lecturas, escrituras, logins) en /vault/logs/audit.log
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultAudit
metadata:
  name: platform-audit
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator-controller-manager
  type: file
  configuration:
    file_path: /vault/logs/audit.log
