apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: artifactory-ui-route
  namespace: devops-tools
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - websecure
  tls: {}   # usa el TLSStore default (cert *.dev.lab, wave 19)
  routes:
    - match: Host(`artifactory.dev.lab`)
      kind: Rule
      services:
        - name: artifactory
          port: 8082