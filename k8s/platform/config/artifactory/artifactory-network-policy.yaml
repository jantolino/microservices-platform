apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifactory-zero-trust
  namespace: devops-tools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artifactory
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8082 # Puerto por defecto de Artifactory
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8082
  egress:
    # Base de datos externa
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data-services
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - port: 5432