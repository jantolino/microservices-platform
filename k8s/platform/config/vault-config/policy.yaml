apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: external-secrets
  namespace: secrets-manager
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: default
  policy: |
    path "secret/data/*" {
      capabilities = ["read"]
    }
    path "secret/metadata/*" {
      capabilities = ["read", "list"]
    }
