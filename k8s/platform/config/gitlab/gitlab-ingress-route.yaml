apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web-route
  namespace: repositories
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - websecure
  tls: {}   # usa el TLSStore default (cert *.dev.lab, wave 19)
  routes:
    - match: Host(`gitlab.dev.lab`)
      kind: Rule
      services:
        - name: gitlab-webservice-default
          port: 8181