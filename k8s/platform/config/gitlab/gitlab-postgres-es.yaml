apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-postgres-password
  namespace: repositories
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-postgres-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/platform/databases/postgres
        property: password
