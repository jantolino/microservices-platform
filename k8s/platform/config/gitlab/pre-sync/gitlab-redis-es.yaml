# Contraseña de Redis para GitLab, leída de Vault (sembrada por bootstrap.sh: secret/data/platform/databases/redis)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-redis-auth
  namespace: repositories
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/platform/databases/redis
        property: password
