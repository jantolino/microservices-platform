# Contraseña de Redis para GitLab, leída de Vault (publicada por config/redis/redis-push-secret.yaml)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-redis-auth
  namespace: repositories
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/platform/databases/redis
        property: password
