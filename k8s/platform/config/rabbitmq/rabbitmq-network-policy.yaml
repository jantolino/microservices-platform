apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-zero-trust
  namespace: data-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    # Prometheus: scrape del plugin de métricas
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 15692
    # Operador de RabbitMQ: gestión del clúster
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq-cluster-operator
      ports:
        - port: 15672