apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jaeger-ui-route
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - websecure
  tls: {}   # usa el TLSStore default (cert *.dev.lab, wave 19)
  routes:
  - match: Host(`jaeger.dev.lab`)
    kind: Rule
    services:
    - name: jaeger
      port: 16686