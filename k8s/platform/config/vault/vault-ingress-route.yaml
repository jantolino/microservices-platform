apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-ui-route
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vault.dev.lab`)
      kind: Rule
      services:
        - name: vault
          port: 8200
