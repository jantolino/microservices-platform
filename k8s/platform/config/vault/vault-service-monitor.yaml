apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vault-metrics
  namespace: secrets-manager
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  namespaceSelector:
    matchNames:
      - secrets-manager
  endpoints:
    - port: http # El chart de Vault expone 8200 con nombre "http"
      path: /v1/sys/metrics
      interval: 30s
