apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-zero-trust
  namespace: security
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy
  ingress:
    # Scrape de métricas desde Prometheus
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # El operador necesita hablar con el API server (reportes, scan jobs)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # Resolución DNS (el operador resuelve nombres de imágenes y servicios)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Pendiente 1.2e: toFQDNs para ghcr.io y mirror.gcr.io:443 (descarga de la DB de vulnerabilidades)