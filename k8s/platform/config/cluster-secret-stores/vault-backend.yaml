apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    part-of: microservices-platform
spec:
  provider:
    vault:
      server: "http://vault.secrets-manager.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Zero-trust: sin token estatico. ESO presenta un JWT efimero de su
        # ServiceAccount; Vault lo valida via TokenReview.
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-vault"
            namespace: "security"
