# CA raíz de la plataforma: selfsigned -> Certificate isCA -> ClusterIssuer tipo ca
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: cert-manager
  labels:
    part-of: microservices-platform
spec:
  isCA: true
  commonName: microservices-platform-ca
  secretName: platform-ca-tls
  duration: 87600h # 10 años
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca-issuer
spec:
  ca:
    secretName: platform-ca-tls
