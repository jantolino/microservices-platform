# TLS pendiente de la tarea 1.5 (CA propia + TLSStore de Traefik); de momento solo web.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-ui-route
  namespace: headlamp
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headlamp.dev.lab`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
