# Filebeat es un DaemonSet SIN Service (chart elastic 8.5.1) → PodMonitor, no ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: filebeat-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: filebeat   # ← label real del chart elastic 8.5.1
  namespaceSelector:
    matchNames:
      - monitoring
  podMetricsEndpoints:
    - portNumber: 5066
      path: /stats
      interval: 30s
