apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-zero-trust
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: elasticsearch-master   # ← label real del chart elastic 8.5.1
  policyTypes:
    - Ingress
  ingress:
    # Solo Kibana y Filebeat pueden hablar con Elastic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: kibana   # ← label real del chart
      ports:
        - port: 9200
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: filebeat   # ← label real del chart
      ports:
        - port: 9200
    # Jaeger: almacenamiento de trazas
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - port: 9200
    # Prometheus: scrape de métricas
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9200