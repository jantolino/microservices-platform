apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kibana-zero-trust
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kibana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik: UI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 5601
    # Prometheus: scrape de métricas
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 5601
  egress:
    # Elasticsearch
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: filebeat-zero-trust
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus: endpoint de estadísticas
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 5066
  egress:
    # Elasticsearch
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - port: 9200
