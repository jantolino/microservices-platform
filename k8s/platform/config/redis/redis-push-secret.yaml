# Publica en Vault la contraseña que bootstrap.sh generó para Redis (Secret redis-auth).
# Fuente de verdad para los consumidores (ExternalSecret por namespace); Redis no depende de Vault para arrancar.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: redis-auth
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: redis-auth
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: secret/platform/databases/redis
          property: password
