# Etiquetas globales para mantener la coherencia con tu proyecto de microservicios
labels:
  part-of: microservices-platform

# 1. Configuración de Prometheus
prometheus:
  enabled: true
  prometheusSpec:
    # RECURSOS EXPLÍCITOS (aplica a todos los bloques 'resources' de este archivo):
    #
    # El chart no define resources en ningún contenedor, así que cada uno hereda el
    # 'default' del LimitRange del namespace (500m/1Gi). Con ~11 contenedores eso
    # sumaría ~5.5CPU/11Gi y agotaría la quota de 'monitoring'.
    #
    # NO se dimensiona vía LimitRange porque:
    #   - Su 'default' es un valor único que se aplica a TODO contenedor sin
    #     resources: no permite distinguir prometheus (1Gi) de un sidecar (128Mi).
    #   - El LimitRange de 'monitoring' es una red de seguridad compartida (hoy este
    #     stack, mañana ELK/Jaeger), no el contrato de sizing de este componente.
    #   - El sizing explícito es determinista: el consumo contra la quota no cambia
    #     si alguien ajusta los defaults del LimitRange en el futuro.
    #
    # Convención del proyecto: el sizing vive con el componente (igual que
    # data-services/rabbitmq/rabbitmq-cluster.yaml). Lo que sí se ajustó en
    # foundation fue la ResourceQuota (techo agregado del namespace).
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 300m
        memory: 1Gi
    configReloaderResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Retención de datos: cuánto tiempo se guardan las métricas antes de borrarse
    retention: 10d

    # Selección explícita de ServiceMonitors (1.8): con selector nil + false,
    # Prometheus selecciona TODOS los SM (centralizados en config/<x>/ y etiquetados release: prometheus)
    serviceMonitorSelectorNilUsesHelmValues: false

    # Persistencia: Vital para no perder tus gráficas y datos al reiniciar pods
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# 2. Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
    configReloaderResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# 3. Operador y exportadores
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# 4. Configuración de Grafana
grafana:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  # Sidecars de dashboards/datasources (kiwigrid): el campo resources es compartido
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Credenciales desde Secret generado por ESO (config/prometheus-stack/grafana-es.yaml)
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Persistencia para Grafana (evita perder dashboards creados manualmente)
  persistence:
    enabled: true
    type: pvc
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection

    # 2. SOLUCIÓN AL PERMISSION DENIED:
    # Estas propiedades NO están en el bloque 'adminApi',
    # deben colgar directamente de 'grafana:'

  initChownData:
    enabled: false # Desactiva el contenedor que da error

  podSecurityContext:
    fsGroup: 472 # Asigna el permiso al volumen desde K8s

  containerSecurityContext:
    runAsUser: 472
    runAsGroup: 472