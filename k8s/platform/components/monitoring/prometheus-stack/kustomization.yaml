apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: prometheus-stack
    includeSelectors: false

resources:
  - grafana-es.yaml
  - prometheus-stack-network-policy.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 84.5.0
    releaseName: prometheus
    namespace: monitoring
    valuesFile: prometheus-stack-values.yaml
    includeCRDs: true

# Los Jobs de admission son hooks helm con 'hook-succeeded' en su delete-policy:
# Argo los borra nada mas completar y, al re-evaluar el recurso, lo marca
# 'missing' -> SyncFailed -> retry -> nuevo Job -> se borra -> bucle infinito.
# Con 'before-hook-creation' el Job sobrevive y Argo puede leer su estado Complete.
patches:
  - path: prometheus-stack-admission-hook-patch.yaml