apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alert-manager-ui-route
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`alertmanager.desarrollo`)
      kind: Rule
      services:
        - name: prometheus-kube-prometheus-alertmanager
          port: 9093