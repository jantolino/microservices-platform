# Etiquetas globales para todos los recursos creados por el Chart
commonLabels:
  part-of: microservices-platform

jaeger:
  # Recursos para el binario principal (Jaeger V2 usa un solo despliegue por defecto)
  # Nota: en este chart resources cuelga de "jaeger:", no de la raíz
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Contraseña de Elasticsearch desde el Secret que auto-genera el chart de ES.
  # Se resuelve en userconfig con ${env:ELASTIC_PASSWORD} (sustitución nativa de Jaeger v2).
  extraEnv:
    - name: ELASTIC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-elastic-password
          key: elastic-password

userconfig:

  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: []
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: primary_store_elasticsearch
        traces_archive: archive_store_elasticsearch
    jaeger_storage:
      backends:
        primary_store_elasticsearch:
          elasticsearch:
            server_urls: ["http://elasticsearch-master.monitoring.svc.cluster.local:9200"]
            auth:
              basic:
                username: elastic
                password: ${env:ELASTIC_PASSWORD}
            tls:
              insecure_skip_verify: true
        archive_store_elasticsearch:
          elasticsearch:
            server_urls: ["http://elasticsearch-master.monitoring.svc.cluster.local:9200"]
            auth:
              basic:
                username: elastic
                password: ${env:ELASTIC_PASSWORD}
            tls:
              insecure_skip_verify: true

  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store_elasticsearch

# Desactivado: el chart solo soporta ES_PASSWORD en texto plano (storage.elasticsearch.password)
# para los jobs de mantenimiento. Sin credenciales en Git, el job no puede autenticarse.
esIndexCleaner:
  enabled: false

storage:
  elasticsearch:
    tls:
      enabled: true
      skip_verify: true
    url: "http://elasticsearch-master.monitoring.svc.cluster.local:9200"
    user: elastic
    # ES_PASSWORD no se define aquí (sería texto plano en Git);
    # el deployment principal la recibe via jaeger.extraEnv.

# ServiceMonitor centralizado en config/jaeger/jaeger-service-monitor.yaml