apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-services

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: rabbitmq
    includeSelectors: false

resources:
  - cluster-operator.yml       # Operador RabbitMQ (ClusterRole, Deployment, etc.)
  - rabbitmq-cluster.yaml      # Definición del clúster RabbitMQ (Custom Resource)
  - rabbitmq-network-policy.yaml  # Bootstrap: egress al API + probes del kubelet