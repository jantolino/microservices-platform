apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  replicas: 1   # Para desarrollo
  image: rabbitmq:4.1.0-management
  resources:
    requests:
      cpu: 100m      # Reducir de 500m a 100m
      memory: 512Mi  # Reducir de 1Gi a 512Mi
    limits:
      cpu: 500m      # Reducir de 2000m a 500m
      memory: 1Gi
  persistence:
    storageClassName: ""
    storage: 5Gi
  rabbitmq:
    # Sin default_user/default_pass: el operador genera credenciales aleatorias
    # en el Secret "rabbitmq-default-user" (kubectl get secret rabbitmq-default-user -n data-services)
    additionalConfig: |
      default_user_tags.administrator = true
      prometheus.return_per_object_metrics = true
  service:
    type: ClusterIP