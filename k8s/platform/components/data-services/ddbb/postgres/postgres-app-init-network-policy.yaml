apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-app-init-egress
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app: postgres-app-init
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
