apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgadmin-secrets
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pgadmin-secrets
    creationPolicy: Owner
  data:
    # 1. Trae la contraseña de la UI de pgadmin desde Vault
    - secretKey: PGADMIN_DEFAULT_PASSWORD
      remoteRef:
        key: secret/data/platform/tools/pgadmin
        property: password
    # 2. TRAE LA MISMA CONTRASEÑA DE POSTGRES (Réplica Distribuida)
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/platform/databases/postgres # <--- EL MISMO PATH QUE ANTES
        property: password