apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-services

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: postgres
    includeSelectors: false

resources:
  - postgres-es.yaml
  - pgadmin-es.yaml
  - app-roles-es.yaml
  - postgres-app-init-job.yaml
  - postgres-app-init-network-policy.yaml
  - pgadmin-network-policy.yaml
  - cnpg-network-policy.yaml

patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    path: cnpg-cluster-argocd-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: pgadmin
    path: pgadmin-env-patch.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1
    releaseName: cnpg
    namespace: data-services
    includeCRDs: true
    valuesFile: cnpg-operator-values.yaml

  - name: cluster
    repo: https://cloudnative-pg.github.io/charts
    version: 0.9.0
    releaseName: postgres
    namespace: data-services
    valuesFile: postgresql-values.yaml

  - name: pgadmin4
    repo: https://helm.runix.net
    version: 1.62.0
    releaseName: pgadmin4-v1-62-0
    namespace: data-services
    valuesFile: pgadmin-values.yaml