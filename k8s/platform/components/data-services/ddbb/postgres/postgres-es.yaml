apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend # Asegúrate de que tu ClusterSecretStore se llame así
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password # <--- CNPG lee username/password del Secret basic-auth
      remoteRef:
        key: secret/data/platform/databases/postgres # <--- Path en Vault (Tú lo defines)
        property: password # <--- Key dentro de Vault