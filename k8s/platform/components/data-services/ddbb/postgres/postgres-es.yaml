apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: data-services
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend # Asegúrate de que tu ClusterSecretStore se llame así
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD # <--- Bitnami leerá esta key
      remoteRef:
        key: secret/data/platform/databases/postgres # <--- Path en Vault (Tú lo defines)
        property: password # <--- Key dentro de Vault