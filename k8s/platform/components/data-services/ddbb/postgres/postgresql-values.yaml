# Instancia PostgreSQL gestionada por CloudNativePG (chart cluster).
# Valores base: charts/cluster/values.yaml. Servicios: postgres-rw / postgres-ro / postgres-r.
# El operador se configura en cnpg-operator-values.yaml.

fullnameOverride: postgres

type: postgresql
mode: standalone

version:
  postgresql: "17"

cluster:
  instances: 1

  additionalLabels:
    part-of: microservices-platform

  storage:
    size: 3Gi
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  # Secret basic-auth (username/password) creado por ESO en postgres-es.yaml
  enableSuperuserAccess: true
  superuserSecret: postgres-credentials

  # Una sola instancia en Minikube: sin PDB y con afinidad por nodo
  enablePDB: false
  affinity:
    topologyKey: kubernetes.io/hostname

  postgresql:
    parameters:
      max_connections: "200"

  monitoring:
    enabled: true
    # PodMonitor centralizado en config/postgres/postgres-pod-monitor.yaml
    podMonitor:
      enabled: false
    prometheusRule:
      enabled: false