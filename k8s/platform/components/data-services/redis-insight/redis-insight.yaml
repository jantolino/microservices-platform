apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: data-services
  labels:
    app.kubernetes.io/name: redis-insight
    part-of: microservices-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-insight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-insight
        part-of: microservices-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: redis-insight
          image: redis/redisinsight:2.70
          ports:
            - name: http
              containerPort: 5540
          env:
            - name: RI_APP_PORT
              value: "5540"
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Las conexiones guardadas en la UI se pierden al reiniciar el pod (sin PVC a propósito)
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: data-services
  labels:
    app.kubernetes.io/name: redis-insight
    part-of: microservices-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-insight
  ports:
    - name: http
      port: 5540
      targetPort: http
