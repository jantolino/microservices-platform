apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: security

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: trivy
    includeSelectors: false

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts
    version: 0.32.1
    releaseName: trivy
    namespace: security
    valuesFile: trivy-values.yaml
    includeCRDs: true