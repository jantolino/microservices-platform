apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: eso-zero-trust
  namespace: security
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name   # controller + cert-controller + webhook (labels distintos en el chart)
        operator: In
        values:
          - external-secrets
          - external-secrets-cert-controller
          - external-secrets-webhook
  egress:
    # Vault (8200): materializar secretos
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: secrets-manager
            app.kubernetes.io/name: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # API server: watch/list de ExternalSecret, SecretStore, ClusterSecretStore
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
  ingress:
    # Webhook de validación (API server) — puerto del contenedor: 8081 ☸️ validar con kubectl get svc -n security
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    # Probes del kubelet + métricas 8080 (ya scrapeada por prometheus-scrape-network-policy)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP