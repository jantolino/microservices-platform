apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headlamp

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: headlamp
    includeSelectors: false

resources:
  - headlamp-network-policy.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.46.0
    releaseName: headlamp
    namespace: headlamp
    valuesFile: headlamp-values.yaml
