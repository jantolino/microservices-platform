apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-zero-trust
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  ingress:
    # 1. External Secrets Operator (ESO)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 2. Vault Config Operator
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: secrets-manager
            app.kubernetes.io/name: vault-config-operator
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 3. Traefik (Solo para la UI de Vault)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 4. Prometheus (scrape de /v1/sys/metrics)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
  egress:
    # 1. API server de Kubernetes (TokenReview del auth method kubernetes)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # 2. DNS: lo concede la CCNP dns-allowlist-clusterwide (L7); una regla L4 aquí lo anularía
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-agent-injector-zero-trust
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault-agent-injector
  ingress:
    # Webhook de mutación (API server) y probes del kubelet: contenedor 8080
    - fromEntities:
        - host
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP