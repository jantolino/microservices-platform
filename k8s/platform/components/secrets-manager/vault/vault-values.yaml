# Etiquetas globales para identificar que es parte de tu stack

global:
  commonLabels:
    part-of: microservices-platform

server:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Habilita el endpoint /v1/sys/metrics en formato Prometheus
  telemetry:
    prometheus_retention_time: "24h"
    disable_hostname: true

  # Habilitamos el almacenamiento persistente para no perder
  # los secretos si se reinicia el cluster
  dataStorage:
    enabled: true
    size: 10Gi

  # Volumen persistente para el audit device (VaultAudit en config/vault-config-operator),
  # montado en /vault/audit. Cambia volumeClaimTemplates: en un clúster ya desplegado
  # requiere recrear el StatefulSet (kubectl delete sts vault --cascade=orphan).
  auditStorage:
    enabled: true
    size: 2Gi

# Interfaz Gráfica (UI)
ui:
  enabled: true
  serviceType: ClusterIP
  serviceNodePort: null
  externalPort: 8200

injector:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi