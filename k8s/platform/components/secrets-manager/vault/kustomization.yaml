apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secrets-manager

resources:
  - vault-network-policy.yaml
  - vault-auth-delegator.yaml

helmCharts:
  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.32.0
    releaseName: vault
    namespace: secrets-manager
    valuesFile: vault-values.yaml