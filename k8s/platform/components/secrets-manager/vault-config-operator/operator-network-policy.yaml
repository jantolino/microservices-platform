apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-config-operator-network-policy
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-config-operator
  policyTypes:
    - Ingress # <--- AGREGADO
    - Egress
  ingress:
    # 1. Permitir a Kubelet hacer los Health Checks (puerto 8081)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 8081
          protocol: TCP
    # 2. Permitir a la API de Kubernetes llamar a los Webhooks (puerto 9443)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system # La API suele estar aquí o desde los nodos
      ports:
        - port: 9443
          protocol: TCP
  egress:
    # ... (Mantén todo tu bloque de Egress exactamente como lo tienes)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443