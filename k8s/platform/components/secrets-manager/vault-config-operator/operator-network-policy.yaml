apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-config-operator-network-policy
  namespace: secrets-manager
  labels:
    part-of: microservices-platform
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault-config-operator
  ingress:
    # 1. Kubelet: Health Checks (puerto 8081)
    # 2. API server: llamadas a los Webhooks (puerto 9443)
    - fromEntities:
        - host
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "9443"
              protocol: TCP
  egress:
    # Vault (configuración declarativa de la plataforma)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # API server de Kubernetes (admission webhooks, watches)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # Resolución DNS (servicio vault en el mismo namespace)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP