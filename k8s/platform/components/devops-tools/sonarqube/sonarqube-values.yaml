
# Etiqueta para los pods (coherencia con la arquitectura)
podLabels:
  part-of: microservices-platform

# Indicar explícitamente que se usa la edición Community
community:
  enabled: true

# MONITORING PASSCODE (OBLIGATORIO para las sondas de salud)
# Valor en Vault: secret/data/platform/tools/sonarqube (via ESO, config/sonarqube/sonarqube-es.yaml)
monitoringPasscodeSecretName: sonarqube-monitoring-passcode
monitoringPasscodeSecretKey: monitoring-passcode

# Reducción de recursos (requests y limits)
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Heap del Elasticsearch embebido (reducido para el clúster de desarrollo)
elasticsearchJavaOpts: "-Xmx512m -Xms512m"

# Habilitar persistencia para los datos de Elasticsearch
persistence:
  enabled: true
  storageClass: ""
  size: 5Gi

# Configuración de la base de datos externa PostgreSQL
jdbcOverwrite:
  enabled: true
  jdbcUrl: "jdbc:postgresql://postgres-rw.data-services.svc.cluster.local:5432/sonarqube"
  jdbcUsername: "sonarqube"
  # Contraseña desde Vault: secret/data/platform/databases/sonarqube (via ESO)
  jdbcSecretName: sonarqube-jdbc
  jdbcSecretPasswordKey: sonarqube-password

# Activar el exportador de métricas para Prometheus
prometheusExporter:
  enabled: true

# Desactivar los tests (no necesarios en desarrollo)
tests:
  enabled: false