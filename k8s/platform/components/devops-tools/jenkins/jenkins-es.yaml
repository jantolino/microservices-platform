apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: devops-tools
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jenkins-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: jenkins-admin-user
      remoteRef:
        key: secret/data/platform/tools/jenkins
        property: jenkins-admin-user
    - secretKey: jenkins-admin-password
      remoteRef:
        key: secret/data/platform/tools/jenkins
        property: jenkins-admin-password
