apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-tools

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: jenkins
    includeSelectors: false

resources:
  - jenkins-es.yaml

helmCharts:
  - name: jenkins
    repo: https://charts.jenkins.io
    version: 5.9.18
    releaseName: jenkins
    namespace: devops-tools
    valuesFile: jenkins-values.yaml