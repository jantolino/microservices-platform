apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-database
  namespace: devops-tools
  labels:
    part-of: microservices-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: artifactory-database
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: secret/data/platform/databases/artifactory
        property: password
---
