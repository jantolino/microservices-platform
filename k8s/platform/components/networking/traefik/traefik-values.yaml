# Etiquetas globales para tu arquitectura
commonLabels:
  part-of: microservices-platform

# Configuración de la API y el Dashboard
api:
  dashboard: true

# El chart no crea el IngressRoute del dashboard; lo hacemos en config/traefik/
# con BasicAuth (traefik-dashboard-route.yaml + traefik-dashboard-auth.yaml)
ingressRoute:
  dashboard:
    enabled: false

# Observabilidad
logs:
  access:
    enabled: true
    level: DEBUG
    format: json

# Metrics
metrics:
  # Enable providing OTel metrics
  otlp:
    enabled: true
    http:
      enabled: true
  prometheus:
    addEntryPointsLabels: true

# Tracing
tracing:
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: "http://jaeger.monitoring.svc.cluster.local:4318/v1/traces"

# Gateway API (Habilitado según tu comando original)
providers:
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      namespacePolicy:
        from: All

# Configuración del servicio para Minikube
service:
  type: LoadBalancer