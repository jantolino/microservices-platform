apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: networking

labels:
  - pairs:
      app.kubernetes.io/part-of: microservices-platform
      platform.dev/component: traefik
    includeSelectors: false

resources:
  - traefik-network-policy.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 39.0.8
    releaseName: traefik
    namespace: networking
    valuesFile: traefik-values.yaml
    includeCRDs: true