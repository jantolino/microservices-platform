apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ui-route
  namespace: monitoring
  labels:
    part-of: microservices-platform
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.desarrollo`)
      kind: Rule
      services:
        - name: prometheus-grafana
          port: 80